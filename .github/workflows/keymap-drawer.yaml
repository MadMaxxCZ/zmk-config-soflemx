name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/config_keymap-drawer.yaml"
      - .github/workflows/keymap-drawer.yaml

jobs:
  draw:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install keymap-drawer
        run: |
          python -m pip install --upgrade pip
          pip install keymap-drawer

      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Parse keymap
        run: |
          mkdir -p keymap-drawer

          keymap parse -z config/sofle.keymap \
            > keymap-drawer/keymap.yaml

      - name: Show parsed keymap
        run: |
          cat keymap-drawer/keymap.yaml

      - name: Draw Base
        run: |
          keymap draw \
            --select-layers Base \
            keymap-drawer/keymap.yaml \
            > keymap-drawer/base.svg

      - name: Draw Symbols
        run: |
          keymap draw \
            --select-layers Symbols \
            keymap-drawer/keymap.yaml \
            > keymap-drawer/symbols.svg

      - name: Draw Nav
        run: |
          keymap draw \
            --select-layers Nav \
            keymap-drawer/keymap.yaml \
            > keymap-drawer/nav.svg

      - name: Draw System
        run: |
          keymap draw \
            --select-layers System \
            keymap-drawer/keymap.yaml \
            > keymap-drawer/system.svg

      - name: Convert SVG to PNG
        run: |
          rsvg-convert -w 1400 keymap-drawer/base.svg \
            -o keymap-drawer/base.png

          rsvg-convert -w 1400 keymap-drawer/symbols.svg \
            -o keymap-drawer/symbols.png

          rsvg-convert -w 1400 keymap-drawer/nav.svg \
            -o keymap-drawer/nav.png

          rsvg-convert -w 1400 keymap-drawer/system.svg \
            -o keymap-drawer/system.png

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add keymap-drawer/

          if ! git diff --staged --quiet; then
            git commit -m "Update keymap images"
            git push
          fi
