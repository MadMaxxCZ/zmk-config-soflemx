CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="Sofle"

CONFIG_ZMK_STUDIO=yes

CONFIG_ZMK_POINTING=y

# 2 BT profiles (1 = work PC, 2 = home PC) so BT_NXT toggles between them.
# On the split central profiles = BT_MAX_PAIRED - 1 peripheral, so 3 -> 2 profiles.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3
